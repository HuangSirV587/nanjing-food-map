<style>
*{box-sizing:border-box}
:root{--bg:#f7f1e8;--card:#fffdfa;--line:#e7dccd;--text:#1f2937;--muted:#6b7280;--shadow:0 10px 30px rgba(15,23,42,.08);--shadow-strong:0 18px 44px rgba(15,23,42,.14)}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#faf6ef,#f6f1e8 42%,#efe6d8);color:var(--text);overflow-x:hidden}
.header{padding:36px 42px 28px;background:linear-gradient(135deg,#111827 0%,#5b342c 46%,#b78652 100%);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 16px 40px rgba(17,24,39,.22)}
.header h1{margin:0;font-size:42px;font-weight:900;letter-spacing:2px}
.header p{margin:10px 0 0;font-size:17px;opacity:.95;max-width:980px;line-height:1.6}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.kpi{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;border:1px solid rgba(255,255,255,.14)}
.mobile-bar{display:none}
.layout{display:grid;grid-template-columns:500px minmax(0,1fr);gap:18px;max-width:1880px;margin:0 auto;padding:18px;overflow-x:hidden}
.layout > *{min-width:0}
.sidebar{display:flex;flex-direction:column;gap:14px;position:sticky;top:118px;height:calc(100vh - 136px);min-width:0}
.panel{background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);min-width:0}
.filters{padding:16px}
.label{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px;letter-spacing:1px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{border:none;background:#f4ede3;color:#6b5b4c;border:1px solid #eadbc7;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;max-width:100%}
.chip.active{background:#111827;color:#fff;border-color:#111827}
.search{margin-top:14px}
.search input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #e6d8c5;background:#fff;font-size:14px;outline:none}
.list-wrap{overflow:auto;padding:10px 12px 14px;scroll-padding-top:24px;min-width:0}
.scene-block{margin:0 0 14px}

.scene-head span{min-width:0;display:flex;align-items:center}
.scene-head small{font-size:12px;color:var(--muted);font-weight:700;flex:none}
.dot{display:inline-block;width:11px;height:11px;border-radius:999px;margin-right:8px;flex:none}
.item{border:1px solid #eee2d5;border-radius:16px;background:linear-gradient(180deg,#fffdfa,#fbf6ee);padding:12px 12px 10px;margin:0 0 10px;cursor:pointer;transition:.16s box-shadow,.16s transform,.16s border-color;scroll-margin-top:16px;min-width:0}
.item:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,23,42,.08)}
.item.active{border-color:#b78652;box-shadow:0 0 0 3px rgba(183,134,82,.12), 0 14px 28px rgba(183,134,82,.16)}
.item .top{display:flex;gap:10px;align-items:flex-start;min-width:0}
.num{min-width:28px;height:28px;border-radius:999px;background:#1f2937;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.name{font-size:16px;font-weight:800;line-height:1.45;word-break:break-word}
.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid #e7d9c7;background:#faf1e4;color:#7a5b3f}
.map-shell{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:12px;min-width:0}
.map-panel{padding:0;overflow:hidden;flex:1;min-height:0}
#map{height:100%;width:100%}
.map-note{padding:12px 14px;line-height:1.7;color:#6b5b4c;background:rgba(255,252,247,.96)}
.empty{padding:24px;color:var(--muted);font-size:14px;text-align:center}

@media (max-width:1250px){
  .layout{grid-template-columns:1fr}
  .sidebar,.map-shell{position:relative;top:0;height:auto}
  .map-panel{min-height:72vh}
  #map{height:72vh}
}

@media (max-width:900px){
  .header{position:relative;padding:22px 16px 18px}
  .header h1{font-size:30px;line-height:1.2}

  .kpi{font-size:12px;padding:7px 10px}

  .mobile-tab{flex:1;border:none;border-radius:999px;padding:12px 14px;font-size:14px;font-weight:800;background:#f4ede3;color:#6b5b4c;border:1px solid #eadbc7}
  .mobile-tab.active{background:#111827;color:#fff;border-color:#111827}
  .layout{display:flex;flex-direction:column;padding:12px;gap:12px}
  .map-shell{order:1;position:relative;height:auto;gap:10px}
  .sidebar{order:2;display:block}
  .filters{padding:14px}
  .label{font-size:12px}
  .chips{display:block;white-space:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{font-size:12px;padding:8px 11px;display:inline-flex;margin-right:8px}
  .search input{font-size:16px}
  .list-wrap{max-height:none;padding:8px 10px 12px}
  .scene-head{font-size:16px;padding:8px 8px 6px}
  .item{padding:11px 11px 9px}
  .name{font-size:15px}
  .meta{font-size:12px;line-height:1.6}
  .map-panel{min-height:50vh;height:50vh;border-radius:18px}
  #map{height:50vh}
  body.mobile-view-list .map-shell{display:none}
  body.mobile-view-map .sidebar{display:none}
  .map-note{font-size:12px;padding:10px 12px}
}
</style>
